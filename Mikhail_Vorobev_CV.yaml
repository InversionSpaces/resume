cv:
  name: Mikhail Vorobev
  headline: '[Latest version of this CV](https://github.com/InversionSpaces/resume)'
  email: inversionspaces@gmail.com
  phone:
  website:
  social_networks:
    - network: GitHub
      username: InversionSpaces
    - network: LinkedIn
      username: InversionSpaces
    - network: Telegram
      username: purely_injected
  location: Germany
  custom_connections:
    - placeholder: English (B2), Russian (native)
      fontawesome_icon: language
      url: null
  sections:
    Experience:
      - company: JetBrains
        position: Language Designer / Researcher
        start_date: 2025
        end_date: present
        summary: Research, design, prototype, and evolve Kotlin language features, investigating ecosystem needs and implementation constraints in coordination with compiler, libraries, and other teams.
        highlights:
          - Build a [K2 compiler-plugin prototype](https://github.com/JetBrains/kotlin-mhp-plugin) to detect potential data races in Kotlin coroutines with interprocedural May-Happen-in-Parallel static analysis.
          - Design `lateinit val` / assign-once properties, including runtime semantics, the compilation scheme, and compatibility with frameworks.
          - Prototype [refinement types](https://github.com/Kotlin/KEEP/blob/main/notes/0006-refinement-types.md) in the Kotlin compiler.
          - Develop proposals to expose internal type-inference controls to library authors, including the [Explicit Type Parameters KEEP](https://github.com/Kotlin/KEEP/blob/main/proposals/KEEP-0469-explicit-type-parameters.md).
          - Investigate integrating virtual threads with Kotlin coroutines, focusing on performance trade-offs; co-author the [KEEP research write-up](https://github.com/Kotlin/KEEP/pull/507).
      - company: Cloudless Labs (formerly Fluence Labs)
        position: Compiler Engineer
        start_date: 2023
        end_date: 2024
        summary: Designed Aqua, a language for orchestrating distributed computations across the Fluence peer-to-peer network, and developed its compiler toolchain in Scala.
        highlights:
          - Achieved a **4x speedup in linking** on large projects through compiler optimization.
          - Worked on parsing, type checking, IR passes, optimizations, and code generation.
          - Researched and implemented language features, including Unison-inspired class-like constructs called abilities and support for folding over CRDT streams.
          - Developed and maintained the Aqua extension for Visual Studio Code.
      - company: Mosaic Research
        position: Backend Engineer
        start_date: 2022
        end_date: 2023
        summary: Developed and maintained C++ infrastructure for high-frequency cryptocurrency trading.
        highlights:
          - Implemented an inter-service communication protocol using Aeron.
          - Built CMake CI pipelines with builds, tests, caching, and automated dependency updates.
          - Developed Python 3 scripts and supporting microservices.
      - company: Tinkoff
        position: Backend Engineer
        start_date: 2021
        end_date: 2022
        summary: Developed and maintained the Scala microservices powering an online credit broker within the Credit and Brokerage Systems team.
        highlights:
          - Integrated a facial recognition service into a fully automated lending workflow, enabling customers to apply for a loan by uploading their passport.
          - Contributed to the development of an internal webhook service and its partner integrations.
          - Integrated RabbitMQ and Kafka into backend services for message-based communication.
          - Implemented MongoDB and PostgreSQL integrations for persistent application data.
    Technical skills:
      - label: Languages
        details: Kotlin, Scala, C, C++, Python 3, TypeScript, Haskell
      - label: Frameworks and libraries
        details: ZIO, Cats, FS2, Akka HTTP, Aeron
      - label: Data and messaging
        details: PostgreSQL, MongoDB, Kafka, RabbitMQ
      - label: Tools
        details: Git, CMake, sbt, GitLab CI, GitHub Actions, Liquibase
    Education:
      - institution: Constructor University Bremen
        area: Software, Data and Technology
        degree: Bachelor's
        start_date: 2024
        end_date: present
        summary: JetBrains Scholarship holder.
      - institution: Moscow Institute of Physics and Technology
        area: Engineering and Computer Science
        degree: Bachelor's (incomplete)
        start_date: 2019
        end_date: 2022
        summary: Phystech School of Applied Mathematics and Informatics.
    Courses:
      - name: Constructor University Bremen - Semantics of Programming Languages
        date: 2026
        summary: Formalized a lambda calculus with subtyping in Lean and proved progress and preservation.
      - name: Constructor University Bremen - Compilers
        date: 2026
        summary: Implemented a compiler for the [LaMa educational language](https://github.com/PLTools/Lama) targeting x86.
      - name: Moscow Institute of Physics and Technology - Concurrency
        date: 2021
        summary: 'Implemented a C++ concurrency library with fibers, futures, and a thread pool.'
      - name: Moscow Institute of Physics and Technology - Distributed systems
        date: 2021
        summary: 'Implemented distributed consensus and replication algorithms in C++: Paxos, Multi-Paxos, and Raft.'
      # - name: Tinkoff.Fintech - Scala development
      #   date: 2020
      #   summary: Developed a RESTful stop-loss/take-profit service in Scala, integrated with Tinkoff Investments.
      # - name: Mail.ru Technotrek - Introduction to production programming and data structures
      #   date: 2020
      #   summary: Implemented a stack-machine emulator and a high-level language compiler targeting it in C and C++.
      - name: Air Engineering School CanSat in Russia - Sounding rocket payload
        start_date: 2017
        end_date: 2019
        summary: Developed onboard firmware and peripheral drivers in C for AVR and STM32 microcontrollers.
    Projects:
      - name: '[Oolong](https://github.com/leviysoft/oolong) | Scala 3'
        date: 2022
        summary: Developed a library for compile-time query generation for document stores using Scala 3 macros, inspired by Quill.
      # - name: '[yaelc](https://gitlab.com/Inversion/yaelc) | C++'
      #   date: 2021
      #   summary: 'Built a compiler for a Java-like language: GNU Flex scanner, GNU Bison LR parser, abstract syntax tree, and type table.'
      # - name: '[PEGgen](https://github.com/InversionSpaces/PEGgen) | Python 3'
      #   date: 2019
      #   summary: Built a command-line tool that generates recursive-descent parsers from formal grammars.
      - name: '[librscs](https://github.com/cansat-rsce/librscs) | C, AVR'
        start_date: 2017
        end_date: 2019
        summary: Developed an Iridium 9602 modem driver in a peripheral-driver library for AVR microcontrollers.
    Teaching:
      - name: Algorithm and Code Training School (ACTS) - Visiting lecturer
        location: Astana, Kazakhstan
        date: 2026
        summary: Delivered a lecture for school students on parsing, ASTs, name resolution, type inference, type checking, control-flow graphs, and static analysis.
      - name: 'Summer School "Slon" - Volunteer tutor'
        location: Pushchino, Russia
        start_date: 2021
        end_date: 2022
        summary: Taught school students formal languages, mathematical logic, functional programming in Scala, and introductory Python.
design:
  theme: classic
  page:
    size: a4
    top_margin: 2cm
    bottom_margin: 2cm
    left_margin: 2cm
    right_margin: 2cm
    show_footer: false
    show_top_note: false
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 255)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.6em
    alignment: left
    date_and_location_column_alignment: right
    font_family:
      body: Source Sans 3
      name: Source Sans 3
      headline: Source Sans 3
      connections: Source Sans 3
      section_titles: Source Sans 3
    font_size:
      body: 11pt
      name: 26pt
      headline: 10pt
      connections: 10pt
      section_titles: 1.4em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: center
    photo_width: 3.5cm
    space_below_name: 0.3cm
    space_below_headline: 0.3cm
    space_below_connections: 0.35cm
    connections:
      phone_number_format: national
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: ''
      space_between_connections: 0.5cm
  section_titles:
    type: with_partial_line
    line_thickness: 1pt
    space_above: 0.3cm
    space_below: 0.18cm
  sections:
    allow_page_break: false
    space_between_regular_entries: 0.6em
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.15cm
    side_space: 0.2cm
    space_between_columns: 0.1cm
    allow_page_break: false
    short_second_row: false
    degree_width: 2cm
    summary:
      space_above: 0cm
      space_left: 0cm
    highlights:
      bullet: •
      nested_bullet: '-'
      space_left: 0.4cm
      space_above: 0cm
      space_between_items: 0cm
      space_between_bullet_and_text: 0.5em
  templates:
    footer: '*NAME -- PAGE_NUMBER/TOTAL_PAGES*'
    top_note: '*LAST_UPDATED CURRENT_DATE*'
    single_date: YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS
    one_line_entry:
      main_column: '**LABEL:** DETAILS'
    education_entry:
      main_column: |-
        **INSTITUTION**
        DEGREE in AREA
        SUMMARY
        HIGHLIGHTS
      degree_column: ''
      date_and_location_column: |-
        LOCATION
        DATE
    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        LOCATION
        DATE
    experience_entry:
      main_column: |-
        **COMPANY**, POSITION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        LOCATION
        DATE
    publication_entry:
      main_column: |-
        **TITLE**
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE
